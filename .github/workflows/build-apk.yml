name: Build Sarfealam Auto-Studio v2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Studio Source ZIP
        run: |
          unzip -o "*.zip"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & add Android platform
        run: |
          npm install --legacy-peer-deps @capacitor/core@^8.0.0 @capacitor/cli@^8.0.0 @capacitor/android@^8.6.2
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Android permissions & queries into AndroidManifest.xml
        run: |
          python3 - << 'EOF'
          import pathlib
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]
          for p in perms:
              if p not in text:
                  text = text.replace('<application', p + '\n    <application', 1)
          queries_block = '\n'.join([
              '<queries>',
              '    <intent><action android:name="android.speech.RecognitionService" /></intent>',
              '    <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>',
              '</queries>',
          ])
          if '<queries>' not in text:
              text = text.replace('<application', queries_block + '\n    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sarfealam-Auto-Studio-v2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Sarfealam Auto-Studio v2 (Build #${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
